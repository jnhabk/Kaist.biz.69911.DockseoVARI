<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 지향점 설문</title>
<!-- docs/specs/jinha-feature.md 의 프로토타입. 서버·로그인·DB 없음. 샘플 멤버 응답은 테스트용으로 지어낸 것이다. -->
<style>
:root {
  --bg: #f4f1ea; --surface: #ffffff; --surface-2: #f8f6f1; --text: #24302b; --muted: #6b746f;
  --line: #ddd8cc; --accent: #2f6b4f; --accent-soft: #e3efe8; --seed: #c8792b; --seed-soft: #f6ebdd;
  --no: #b2463c; --no-soft: #f6e1de; --focus: #2f6b4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a18; --surface: #202623; --surface-2: #272e2b; --text: #e7ece9; --muted: #9aa59f;
    --line: #38423d; --accent: #7cc4a0; --accent-soft: #23392f; --seed: #e3a160; --seed-soft: #3a2c1e;
    --no: #e6877d; --no-soft: #3d2522; --focus: #7cc4a0;
  }
}
:root[data-theme="dark"] {
  --bg: #161a18; --surface: #202623; --surface-2: #272e2b; --text: #e7ece9; --muted: #9aa59f;
  --line: #38423d; --accent: #7cc4a0; --accent-soft: #23392f; --seed: #e3a160; --seed-soft: #3a2c1e;
  --no: #e6877d; --no-soft: #3d2522; --focus: #7cc4a0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.demo { max-width: 760px; margin: 0 auto; padding: 16px 16px 8px; }
.demo h1 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .02em; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.tabs .reset { margin-left: auto; color: var(--muted); }
.scenario-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

.phone { max-width: 440px; margin: 8px auto 40px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 20px 18px 24px; min-height: 560px; }
@media (max-width: 480px) { .phone { margin: 8px 16px 32px; } }
.group-name { font-size: 12px; color: var(--muted); margin: 0; }
h2 { font-size: 20px; margin: 2px 0 4px; line-height: 1.35; }
h3 { font-size: 15px; margin: 22px 0 8px; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; margin: 12px 0 18px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); }
.part { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-bottom: 4px; }
.part.taste { background: var(--seed-soft); color: var(--seed); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .label { flex: 1; min-width: 0; }
.subhead { font-size: 12px; color: var(--muted); margin: 12px 0 0; font-weight: 600; }
.scale { display: flex; gap: 3px; flex-shrink: 0; }
.scale button { width: 34px; height: 32px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font-size: 13px; }
.scale button[aria-pressed="true"].neg { background: var(--no-soft); border-color: var(--no); color: var(--no); font-weight: 700; }
.scale button[aria-pressed="true"].zero { background: var(--line); border-color: var(--muted); font-weight: 700; }
.scale button[aria-pressed="true"].pos { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.scale-legend { display: flex; justify-content: flex-end; gap: 12px; font-size: 11px; color: var(--muted); margin-top: -4px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
input[type="text"] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); margin-top: 8px; }
select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }

.slider { margin: 10px 0 16px; }
.slider .ends { display: flex; justify-content: space-between; font-size: 13px; }
.slider .ends span:last-child { text-align: right; }
.slider input { width: 100%; accent-color: var(--accent); }
.slider .val { text-align: center; font-size: 12px; color: var(--muted); }

.grid { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
.grid th { font-size: 12px; font-weight: 600; color: var(--muted); }
.grid th.slot { text-align: left; width: 62px; font-weight: 500; }
.grid td button { width: 100%; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.grid td button.p { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.grid td button.x { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 6px 0 0; flex-wrap: wrap; }

.range { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.err { color: var(--no); font-size: 13px; margin: 6px 0 0; }

.nav { display: flex; gap: 8px; margin-top: 24px; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); flex: 1; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; background: var(--surface-2); }
.card.accent { border-color: var(--accent); background: var(--accent-soft); }
.card.warn { border-color: var(--no); background: var(--no-soft); }
.choice { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

.summary dt { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; }
.summary dd { margin: 2px 0 0; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px; text-decoration: underline; }

.stat { padding: 8px 0; border-bottom: 1px solid var(--line); }
.stat:last-child { border-bottom: 0; }
.stat .top { display: flex; justify-content: space-between; gap: 2px 8px; align-items: baseline; flex-wrap: wrap; }
.stat .counts { font-size: 12px; color: var(--muted); white-space: nowrap; }
.bar { position: relative; height: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 5px; }
.bar .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.bar .fill.pos { background: var(--accent); }
.bar .fill.neg { background: var(--no); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }
.badge.major { background: var(--accent-soft); color: var(--accent); }
.badge.minor { background: var(--seed-soft); color: var(--seed); }
.track { position: relative; height: 22px; margin: 4px 0 0; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
.track .dot { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--muted); opacity: .55; }
.track .avg { position: absolute; top: 2px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.heat td { height: 40px; text-align: center; font-size: 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); line-height: 1.2; }
.heat td.blocked { background: var(--no-soft); color: var(--no); }
.heat td.cand { border: 2px solid var(--accent); background: var(--accent-soft); font-weight: 700; }
.notes { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.vote-history { font-size: 12px; color: var(--muted); margin: 6px 0 0; padding-left: 18px; }
.done { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div class="demo">
  <h1>시연 컨트롤 · 테스트 모임 4명 중 3명(멤버 A·B·C)은 샘플 응답, 나는 직접 응답</h1>
  <div class="tabs" id="tabs"></div>
  <p class="scenario-note" id="scenario-note"></p>
</div>
<main class="phone" id="app" aria-live="polite"></main>

<script>
// ---------- 고정 데이터 ----------
const EXPECT = [
  { id: 'growth', label: '지적 성장' }, { id: 'social', label: '사람들과의 교류' },
  { id: 'habit', label: '독서 습관 만들기' }, { id: 'view', label: '새로운 시각 얻기' },
  { id: 'rest', label: '휴식·즐거움' },
];
const TOPICS = [
  { id: 'career', label: '일과 커리어' }, { id: 'relation', label: '관계와 가족' },
  { id: 'society', label: '사회 이슈' }, { id: 'growth', label: '자기 성장' },
  { id: 'life', label: '삶과 죽음' }, { id: 'tech', label: '기술과 미래' },
  { id: 'money', label: '돈과 경제' }, { id: 'art', label: '예술과 문화' },
];
const GENRES = [
  { id: 'novel', label: '소설', group: '문학' }, { id: 'mystery', label: '추리·스릴러', group: '문학' },
  { id: 'sf', label: 'SF·판타지', group: '문학' }, { id: 'essay', label: '에세이', group: '문학' },
  { id: 'poem', label: '시', group: '문학' }, { id: 'classic', label: '고전', group: '문학' },
  { id: 'biz', label: '경영·경제', group: '비문학' }, { id: 'tech', label: '기술·과학', group: '비문학' },
  { id: 'society', label: '사회·정치', group: '비문학' }, { id: 'history', label: '역사', group: '비문학' },
  { id: 'humanities', label: '인문·철학', group: '비문학' }, { id: 'psych', label: '심리·자기계발', group: '비문학' },
];
const LENGTHS = [
  { id: 'short', label: '250쪽 이하' }, { id: 'mid', label: '250~400쪽' },
  { id: 'long', label: '400쪽 이상도 괜찮음' },
];
const DIFFS = [
  { id: 'light', label: '가볍게 읽히는 책' }, { id: 'mid', label: '적당히 생각할 거리' },
  { id: 'hard', label: '어려워도 도전' },
];
const AI_AXES = [
  { id: 'talk', left: '개인 경험 교류', right: '특정 주제 토론' },
  { id: 'depth', left: '가볍게', right: '깊게' },
  { id: 'apply', left: '책 내용 중심', right: '내 삶에 적용' },
];
const RECORDS = [
  { id: '0', label: '0개', sub: '모임에서 말로 나눌래요' },
  { id: '1-2', label: '1~2개', sub: '인상 깊은 곳만' },
  { id: '3+', label: '3개 이상', sub: '읽으면서 꾸준히' },
];
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const SLOTS = [
  { id: 'm', label: '오전', time: '10–13시' },
  { id: 'a', label: '오후', time: '14–17시' },
  { id: 'e', label: '저녁', time: '19–22시' },
];
const DUR_OPTS = [1, 1.5, 2, 2.5, 3, 3.5, 4];
const PREP_OPTS = [6, 12, 24, 48, 72];
const MEMBERS = ['A', 'B', 'C'];
const LEADER = 'A'; // 이번 회차 모임장 (샘플)
const BOOKS = [
  { title: '『샘플 책 1』', genre: 'biz' },
  { title: '『샘플 책 2』', genre: 'mystery' },
  { title: '『샘플 책 3』', genre: 'sf' },
];
const MY_RECORD_AT_DEADLINE = { progress: 80, underline: 4, thought: 1 };

const GROUPS = {
  g1: { name: 'MBA 독서모임', note: '새로 개설된 모임' },
  g2: { name: '동네 독서모임', note: '두 번째로 가입하는 모임' },
  g3: { name: '회사 동료 독서모임', note: '정기 시간이 이미 정해진 모임', fixed: { cell: '목-e', dur: 2.5, prep: 24 } },
};

// 그리드 문자열: 요일 월~일 순서, p=선호 o=가능 x=불가
function gridFrom(rows) {
  const g = {};
  SLOTS.forEach((s, si) => DAYS.forEach((d, di) => { g[d + '-' + s.id] = { p: 'p', o: 'o', x: 'x' }[rows[si][di]]; }));
  return g;
}
const SAMPLE = {
  A: { expect: { growth: 2, social: 1, habit: 1, view: 2, rest: 0 }, topics: ['career', 'society', 'growth'], topicNote: '일하면서 부딪히는 고민',
       genres: { novel: 1, mystery: 0, sf: -1, essay: 1, poem: -1, classic: 0, biz: 2, tech: 1, society: 2, history: 1, humanities: 1, psych: 0 },
       novelty: 60, length: 'mid', difficulty: 'mid', ai: { talk: 40, depth: 70, apply: 70 }, finishOk: 1, record: '1-2',
       grid: gridFrom(['xxxxxox', 'xxxxxoo', 'opopxxo']), durMin: 2, durMax: 3, prepMin: 24, prepMax: 72, wishlist: [] },
  B: { expect: { growth: 1, social: 2, habit: 2, view: 1, rest: 1 }, topics: ['relation', 'growth', 'art'], topicNote: '요즘 관계에 대한 고민',
       genres: { novel: 2, mystery: 1, sf: 2, essay: 2, poem: 0, classic: -1, biz: 0, tech: -1, society: 0, history: -1, humanities: 0, psych: 1 },
       novelty: 40, length: 'short', difficulty: 'light', ai: { talk: 20, depth: 40, apply: 80 }, finishOk: 2, record: '1-2',
       grid: gridFrom(['xxxxxpx', 'xxxxxpo', 'ooppxxx']), durMin: 1.5, durMax: 2.5, prepMin: 12, prepMax: 24, wishlist: [] },
  C: { expect: { growth: 2, social: 0, habit: 1, view: 2, rest: -1 }, topics: ['society', 'tech', 'money'], topicNote: '',
       genres: { novel: 0, mystery: 2, sf: 0, essay: -1, poem: 1, classic: 1, biz: 1, tech: 2, society: 1, history: 2, humanities: 2, psych: -1 },
       novelty: 80, length: 'long', difficulty: 'hard', ai: { talk: 70, depth: 90, apply: 40 }, finishOk: -1, record: '3+',
       grid: gridFrom(['xxxxxxx', 'xxxxxoo', 'xopoxop']), durMin: 2, durMax: 3, prepMin: 24, prepMax: 48, wishlist: [] },
};
// 다른 시나리오를 먼저 열었을 때 "기존 모임 응답"으로 쓰는 시연용 내 응답
const SAMPLE_ME = {
  expect: { growth: 2, social: 1, habit: 2, view: 1, rest: 0 }, topics: ['career', 'growth'], topicNote: '',
  genres: { novel: 1, mystery: 0, sf: -1, essay: 1, poem: 0, classic: 0, biz: 2, tech: 1, society: 1, history: 0, humanities: 1, psych: 1 },
  novelty: 50, length: 'mid', difficulty: 'mid', ai: { talk: 50, depth: 60, apply: 60 }, finishOk: 1, record: '1-2',
  grid: gridFrom(['xxxxxoo', 'xxxxxoo', 'oooooxx']), durMin: 2, durMax: 3, prepMin: 24, prepMax: 48, wishlist: [],
};

function blankAnswers() {
  const genres = {}; GENRES.forEach(g => genres[g.id] = 0);
  const expect = {}; EXPECT.forEach(e => expect[e.id] = 0);
  const grid = {}; SLOTS.forEach(s => DAYS.forEach(d => grid[d + '-' + s.id] = 'o'));
  return { expect, topics: [], topicNote: '', genres, novelty: 50, length: null, difficulty: null,
           ai: { talk: 50, depth: 50, apply: 50 }, finishOk: 0, record: null, grid,
           durMin: 2, durMax: 2.5, prepMin: 24, prepMax: 48, wishlist: ['', '', ''] };
}
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- 상태 (브라우저에만 저장) ----------
const KEY = 'jinha-orientation-survey-v1';
function freshState() {
  return { scenario: 'new', screen: 'survey', step: 1, draft: null, err: '',
           mine: {}, seeded: {}, votes: {}, commits: {}, sim: 'all', midjoin: null, resurvey: null, resurveyDone: null };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || freshState(); } catch (e) { S = freshState(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- 시나리오 ----------
const SCENARIOS = [
  { id: 'new', label: '① 새 모임 첫 설문', group: 'g1', note: 'MBA 독서모임이 새로 개설됐습니다. 가입 설문(6장)을 마치면 4명 집계와 정기 일정 투표로 이어집니다.' },
  { id: 'second', label: '② 두 번째 모임 가입', group: 'g2', note: '이미 다른 모임에 설문을 낸 유저가 새 모임에 들어갈 때입니다. 첫 문항에서 기존 응답을 그대로 쓸지 묻습니다.' },
  { id: 'midjoin', label: '③ 중간 가입자', group: 'g3', note: '정기 시간이 이미 정해진 모임에 새로 들어갈 때입니다. 설문 끝에 정기 시간 약속을 받습니다.' },
  { id: 'results', label: '④ 집계·일정 투표', group: 'g1', note: 'MBA 독서모임의 집계 화면입니다. 내가 아직 응답하지 않았으면 3/4로 보입니다.' },
  { id: 'resurvey', label: '⑤ 정기 재설문', group: 'g1', note: 'MBA 독서모임이 3회를 마친 뒤의 재설문입니다. 지난 3권과 실제 기록을 반영합니다.' },
];
const scen = () => SCENARIOS.find(x => x.id === S.scenario);
const gid = () => scen().group;

function ensureSeed(g) { // 시연용: 기존 모임 응답이 필요한데 없으면 샘플을 넣는다
  if (!S.mine[g]) { S.mine[g] = clone(SAMPLE_ME); S.seeded[g] = true; }
}
function priorGroups(g) { return Object.keys(S.mine).filter(k => k !== g); }

function startScenario(id) {
  S.scenario = id; S.err = ''; S.draft = null; S.midjoin = null;
  const g = gid();
  if (id === 'second') ensureSeed('g1');
  if (id === 'resurvey') { ensureSeed('g1'); S.screen = 'resurvey'; S.step = 1; S.resurveyDone = null; S.resurvey = newResurvey(); }
  else if (id === 'results') { S.screen = 'results'; }
  else if (S.mine[g]) { S.screen = id === 'midjoin' ? 'commit' : 'results'; }
  else { S.screen = 'survey'; S.step = priorGroups(g).length ? 0 : 1; S.draft = blankAnswers(); }
  save(); render(); window.scrollTo(0, 0);
}

// ---------- 공통 렌더 조각 ----------
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cellLabel = k => { const [d, s] = k.split('-'); const sl = SLOTS.find(x => x.id === s); return `${d}요일 ${sl.label} (${sl.time})`; };
const hours = h => (h % 1 ? h : h) + '시간';
const label = (list, id) => (list.find(x => x.id === id) || {}).label || '—';
const fmt = n => (n > 0 ? '+' : '') + (Math.round(n * 10) / 10);

function validateStep(d, st) {

// ---------- 집계 ----------
function respondents(g) {
  const list = MEMBERS.map(m => ({ who: m, a: SAMPLE[m] }));
  if (S.mine[g]) list.push({ who: 'me', a: S.mine[g] });
  return list;
}
const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
function dist(vals) { return { pos: vals.filter(v => v > 0).length, zero: vals.filter(v => v === 0).length, neg: vals.filter(v => v < 0).length }; }
function divBar(v) {
  const w = Math.abs(v) / 2 * 50;
  return `<div class="bar"><div class="mid"></div><div class="fill ${v >= 0 ? 'pos' : 'neg'}" style="${v >= 0 ? `left:50%` : `left:${50 - w}%`};width:${w}%"></div></div>`;
}
function genreStats(rs) {
  const n = rs.length;
  const list = GENRES.map(x => {
    const vals = rs.map(r => r.a.genres[x.id]);
    return { ...x, avg: avg(vals), d: dist(vals) };
  }).sort((a, b) => b.avg - a.avg || b.d.pos - a.d.pos);
  list.forEach((x, i) => { x.major = i < 3; x.minor = !x.major && x.d.pos / n >= 0.2; });
  return list;
}
function gridStats(rs) {
  const st = {};
  SLOTS.forEach(s => DAYS.forEach(d => {
    const k = d + '-' + s.id; const c = { p: 0, o: 0, x: 0, k, order: SLOTS.indexOf(s) * 7 + DAYS.indexOf(d) };
    rs.forEach(r => c[r.a.grid[k]]++); st[k] = c;
  }));
  return st;
}
function scheduleCandidates(rs) {
  const all = Object.values(gridStats(rs));
  const rank = (a, b) => b.p - a.p || (b.p + b.o) - (a.p + a.o) || a.order - b.order;
  let c = all.filter(x => x.x === 0).sort(rank), widened = false;
  if (!c.length) { c = all.filter(x => x.x === 1).sort(rank); widened = true; }
  return { list: c.slice(0, 3).map(x => x.k), widened };
}
function rangeCandidates(rs, minK, maxK, OPTS) {
  const mids = rs.map(r => (r.a[minK] + r.a[maxK]) / 2).sort((a, b) => a - b);
  const med = mids.length % 2 ? mids[(mids.length - 1) / 2] : (mids[mids.length / 2 - 1] + mids[mids.length / 2]) / 2;
  return OPTS.map(v => ({ v, n: rs.filter(r => r.a[minK] <= v && v <= r.a[maxK]).length }))
    .filter(x => x.n > 0).sort((a, b) => b.n - a.n || Math.abs(a.v - med) - Math.abs(b.v - med) || b.v - a.v)
    .slice(0, 3).map(x => x.v);
}

// ---------- 투표 ----------
const ITEMS = {
  schedule: { title: '정기 일정', show: k => cellLabel(k) },
  dur: { title: '진행 시간', show: v => hours(v), minK: 'durMin', maxK: 'durMax', OPTS: DUR_OPTS },
  prep: { title: '준비 완료 시점', show: v => `모임 ${hours(v)} 전`, minK: 'prepMin', maxK: 'prepMax', OPTS: PREP_OPTS },
};
function candidatesFor(item, rs) {
  if (item === 'schedule') return scheduleCandidates(rs);
  const it = ITEMS[item]; return { list: rangeCandidates(rs, it.minK, it.maxK, it.OPTS), widened: false };
}
function voteState(g, item, rs) {
  S.votes[g] = S.votes[g] || {};
  if (!S.votes[g][item]) { const c = candidatesFor(item, rs); S.votes[g][item] = { round: 1, proposal: c.list[0], history: [], decided: null, by: null }; }
  return S.votes[g][item];
}
// 샘플 멤버의 투표: 범위·가능 여부에 따라 자동으로. 시뮬레이션 설정은 정기 일정에서 멤버 B에게만 적용.
function sampleVote(m, item, value, round, cands) {
  const a = SAMPLE[m];
  if (item === 'schedule') {
    const alt = cands.find(k => k !== value && a.grid[k] !== 'x');
    if (m === 'B' && (S.sim === 'always' || (S.sim === 'once' && round === 1)) && alt) return { yes: false, alt };
    return { yes: true, accommodate: a.grid[value] === 'x' };
  }
  const it = ITEMS[item];
  if (a[it.minK] <= value && value <= a[it.maxK]) return { yes: true };
  return { yes: false, alt: cands.find(v => a[it.minK] <= v && v <= a[it.maxK]) };
}
function castVote(g, item, yes, alt) {
  const rs = respondents(g), v = voteState(g, item, rs), cands = candidatesFor(item, rs).list;
  const results = MEMBERS.map(m => ({ m, ...sampleVote(m, item, v.proposal, v.round, cands) }));
  results.push({ m: 'me', yes, alt, accommodate: yes && item === 'schedule' && S.mine[g].grid[v.proposal] === 'x' });
  const no = results.filter(r => !r.yes);
  const accommodated = results.filter(r => r.accommodate).length;
  if (!no.length) {
    v.history.push({ round: v.round, proposal: v.proposal, ok: true, accommodated });
    v.decided = v.proposal; v.by = 'vote';
  } else {
    v.history.push({ round: v.round, proposal: v.proposal, ok: false, no: no.length });
    if (v.round >= 3) { // 첫 투표 + 재투표 2회까지 실패 → 이번 회차 모임장이 결정
      v.decided = item === 'schedule' ? (cands.find(k => SAMPLE[LEADER].grid[k] !== 'x') || cands[0])
        : (cands.find(x => SAMPLE[LEADER][ITEMS[item].minK] <= x && x <= SAMPLE[LEADER][ITEMS[item].maxK]) || cands[0]);
      v.by = 'leader';
    } else {
      const next = (no.find(r => r.m === 'me') || no[0]).alt || cands.find(k => k !== v.proposal) || v.proposal;
      v.round++; v.proposal = next;
    }
  }
  save(); render();
}

// ---------- 집계 화면 ----------
function renderResults() {
  const g = gid(), rs = respondents(g), n = rs.length, all = n === 4;
  let h = `<p class="group-name">${esc(GROUPS[g].name)} · 모임 집계</p><h2>우리 모임의 지향점</h2>
    <p class="hint">응답 ${n}/4명. 개인 응답은 공개하지 않고 사람 수만 보여줍니다.</p>`;
  if (!all) h += `<div class="card warn"><b>아직 1명이 응답하지 않았어요.</b><p class="small">모두 응답해야 정기 일정을 투표할 수 있어요.</p>
    <button type="button" class="btn small" data-act="scenario" data-val="new">내 설문 하러 가기</button></div>`;

  h += `<h3>이 모임에 기대하는 것</h3>` + EXPECT.map(e => {
    const vals = rs.map(r => r.a.expect[e.id]), d = dist(vals), a = avg(vals);
    return `<div class="stat"><div class="top"><span>${e.label}</span><span class="counts">평균 ${fmt(a)} · 기대 ${d.pos} · 보통 ${d.zero} · 안 함 ${d.neg}</span></div>${divBar(a)}</div>`;
  }).join('');

  const tc = TOPICS.map(t => ({ ...t, n: rs.filter(r => r.a.topics.includes(t.id)).length })).filter(t => t.n).sort((a, b) => b.n - a.n);
  const notes = rs.map(r => r.a.topicNote).filter(Boolean);
  h += `<h3>나누고 싶은 주제</h3><div class="chips">${tc.map(t => `<span class="badge ${t.n > 1 ? 'major' : 'minor'}" style="font-size:12px;padding:4px 10px">${t.label} ${t.n}명</span>`).join('')}</div>
    ${notes.length ? `<ul class="notes">${notes.map(x => `<li>"${esc(x)}"</li>`).join('')}</ul>` : ''}`;

  const gs = genreStats(rs);
  h += `<h3>장르</h3><p class="hint"><span class="badge major">다수 취향</span> 평균 상위 3개 · <span class="badge minor">소수 취향</span> ${n}명 중 20% 이상이 선호했지만 상위 3개는 아닌 장르. 모임원 수만큼의 책 중 1권은 소수 취향에서 고릅니다.</p>`

    <div class="track">${vals.map(v => `<span class="dot" style="left:${v}%"></span>`).join('')}<span class="avg" style="left:${a}%" title="평균"></span></div></div>`; };
  h += `<h3>책 고르기 기준</h3>${track(rs.map(r => r.a.novelty), '익숙한 분야', '새로운 분야')}
    <p class="small">분량: ${LENGTHS.map(x => `${x.label} ${rs.filter(r => r.a.length === x.id).length}명`).join(' · ')}</p>
    <p class="small">난이도: ${DIFFS.map(x => `${x.label} ${rs.filter(r => r.a.difficulty === x.id).length}명`).join(' · ')}</p>
    <h3>AI 발제 방향</h3><p class="hint">작은 점은 각 멤버, 큰 점은 평균입니다. AI 발제문은 평균 쪽으로 만들되, 한쪽 끝의 의견도 질문 하나에는 반영합니다.</p>
    ${AI_AXES.map(a => track(rs.map(r => r.a.ai[a.id]), a.left, a.right)).join('')}
    <h3>참여 부담</h3>${(() => { const vals = rs.map(r => r.a.finishOk), d = dist(vals); return `<div class="stat"><div class="top"><span>완독 못 해도 참여 OK</span><span class="counts">동의 ${d.pos} · 보통 ${d.zero} · 비동의 ${d.neg}</span></div>${divBar(avg(vals))}</div>`; })()}
    <p class="small">한 권에 남길 기록: ${RECORDS.map(x => `${x.label} ${rs.filter(r => r.a.record === x.id).length}명`).join(' · ')}</p>`;

  h += GROUPS[g].fixed ? renderFixed(g) : renderSchedule(g, rs, all);
  return h;
}

function heatmap(rs, cands) {
  const st = gridStats(rs);
  return `<table class="grid heat"><thead><tr><th class="slot"></th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>
    ${SLOTS.map(s => `<tr><th class="slot">${s.label}</th>${DAYS.map(d => {
      const c = st[d + '-' + s.id], rank = cands.indexOf(c.k);
      return `<td class="${rank >= 0 ? 'cand' : c.x ? 'blocked' : ''}" title="${cellLabel(c.k)}">${rank >= 0 ? `후보${rank + 1}<br>` : ''}★${c.p}${c.x ? ` ✕${c.x}` : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>
    <p class="legend"><span>★ 선호한 사람 수</span><span>✕ 불가한 사람 수</span><span>초록 테두리 = 투표 후보</span></p>`;
}

function renderSchedule(g, rs, all) {

    ${heatmap(rs, sc.list)}
    ${sc.widened ? `<div class="card warn small">불가가 0명인 시간이 없어 <b>불가 1명</b>인 칸까지 후보를 넓혔어요. 불가로 답한 멤버가 "맞춰 볼게요"라고 해야 통과합니다.</div>` : ''}`;
  if (!all) return h + `<p class="hint">4명이 모두 응답하면 투표가 열립니다.</p>`;
  h += `<div class="card"><label class="small">시연: 다른 멤버의 투표
      <select data-act="sim"><option value="all" ${S.sim === 'all' ? 'selected' : ''}>조건에 맞으면 모두 찬성</option>
      <option value="once" ${S.sim === 'once' ? 'selected' : ''}>멤버 B가 정기 일정에 한 번 반대</option>
      <option value="always" ${S.sim === 'always' ? 'selected' : ''}>멤버 B가 정기 일정에 계속 반대</option></select></label>
      <button type="button" class="link" data-act="resetVotes" style="margin-left:8px">투표 다시 하기</button></div>`;
  ['schedule', 'dur', 'prep'].forEach(item => { h += voteCard(g, item, rs); });
  const v = S.votes[g] || {};
  if (['schedule', 'dur', 'prep'].every(k => v[k] && v[k].decided != null)) h += commitCard(g, v.schedule.decided, v.dur.decided, v.prep.decided);
  return h;
}
function voteCard(g, item, rs) {
  const it = ITEMS[item], v = voteState(g, item, rs), cands = candidatesFor(item, rs).list;
  const hist = v.history.length ? `<ol class="vote-history">${v.history.map(x => `<li>${x.round}차: ${it.show(x.proposal)} → ${x.ok ? '전원 동의' + (x.accommodated ? ` (불가였던 ${x.accommodated}명이 맞춰 보기로 함)` : '') : `반대 ${x.no}명`}</li>`).join('')}</ol>` : '';
  if (v.decided != null) {
    return `<div class="card accent"><b>${it.title}</b>: <span class="done">${it.show(v.decided)}</span>
      <p class="small">${v.by === 'leader' ? `재투표 2회까지 전원 동의가 나오지 않아 이번 회차 모임장(멤버 ${LEADER})이 정했어요.` : '전원 동의로 확정됐어요.'}</p>${hist}</div>`;
  }
  const me = S.mine[g], blockedMe = item === 'schedule' && me.grid[v.proposal] === 'x';
  const alts = cands.filter(c => c !== v.proposal);
  return `<div class="card"><b>${it.title}</b> · ${v.round === 1 ? '첫 투표' : `재투표 ${v.round - 1}/2`}
    <p>제안: <b>${it.show(v.proposal)}</b>${v.round === 1 ? ' (추천 1순위)' : ''}</p>
    <p class="small muted">다른 후보: ${alts.map(it.show).join(', ') || '없음'}</p>
    ${blockedMe ? `<p class="small"><b>이 시간을 '불가'로 답하셨어요. 이 시간에 맞춰 줄 수 있나요?</b></p>` : ''}
    <div class="nav" style="margin-top:8px"><button type="button" class="btn primary" data-act="vote" data-item="${item}" data-val="yes">${blockedMe ? '맞춰 볼게요' : '동의'}</button>
    ${alts.length ? `<select data-act="alt" data-item="${item}" aria-label="대신 제안할 후보">${alts.map(c => `<option value="${c}">${it.show(c)}</option>`).join('')}</select>
    <button type="button" class="btn" data-act="vote" data-item="${item}" data-val="no">반대하고 이걸 제안</button>` : `<button type="button" class="btn" data-act="vote" data-item="${item}" data-val="no">반대</button>`}</div>${hist}</div>`;
}
function commitCard(g, cell, dur, prep) {

  return `<div class="card accent"><b>우리 모임 정기 시간</b><p style="font-size:17px;margin:6px 0"><b>매월 ${cellLabel(cell)}</b></p>

  if (S.midjoin === 'no') return h + `<div class="card"><b>멤버 전원에게 보낸 알림 (미리보기)</b>

  return h + `<button type="button" class="choice" data-act="midjoin" data-val="yes">네, 이 시간 비워 두겠습니다<small>약속 멤버로 표시됩니다.</small></button>

}

function offTasteBooks() { const me = S.mine.g1; return BOOKS.filter(b => me.genres[b.genre] <= 0); }
function newResurvey() {
  const me = S.mine.g1;
  return { books: BOOKS.map(() => 0), aiHelp: 0, prepFit: null, keep: null, grid: clone(me.grid),
           expect: clone(me.expect), genres: clone(me.genres), novelty: me.novelty, off: 0, offNote: '' };
}
function resurveySteps() { return offTasteBooks().length ? 4 : 3; }

      <h3>준비 완료 시점은 적절했나요?</h3>

      <div class="chips">${[['early', '너무 일렀어요'], ['ok', '적절했어요'], ['late', '더 일찍 마감해도 돼요']].map(([id, l]) => `<button type="button" data-act="rpick" data-path="prepFit" data-val="${id}" aria-pressed="${r.prepFit === id}">${l}</button>`).join('')}</div>`;

      + (r.keep === 'change' ? `<h3>지금 가능한 시간</h3><p class="hint">가입 때 답을 채워 두었어요. 바뀐 칸만 고치세요.</p>${gridInput('grid', r.grid)}` : '');

// ---------- 렌더와 이벤트 ----------
function render() {
  document.getElementById('tabs').innerHTML = SCENARIOS.map(x => `<button type="button" data-act="scenario" data-val="${x.id}" aria-pressed="${S.scenario === x.id}">${x.label}</button>`).join('')

  document.getElementById('scenario-note').textContent = scen().note;
  const app = document.getElementById('app');
  app.innerHTML = S.screen === 'survey' ? renderSurvey() : S.screen === 'commit' ? renderCommit()
    : S.screen === 'resurvey' ? renderResurvey() : renderResults();
}
const target = () => S.screen === 'resurvey' ? S.resurvey : S.draft;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const act = b.dataset.act, val = b.dataset.val;
  if (act === 'scenario') return startScenario(val);
  if (act === 'reset') { S = freshState(); save(); return startScenario('new'); }
  if (act === 'set') setPath(target(), b.dataset.path, +val);
  if (act === 'pick') setPath(S.draft, b.dataset.path, val);
  if (act === 'rpick') setPath(S.resurvey, b.dataset.path, val);
  if (act === 'topic') { const t = S.draft.topics; t.includes(val) ? t.splice(t.indexOf(val), 1) : t.push(val); }
  if (act === 'cell') { const grid = target()[b.dataset.path]; grid[b.dataset.key] = { o: 'p', p: 'x', x: 'o' }[grid[b.dataset.key]]; }
  if (act === 'copy') {
    if (val === 'yes') { const from = S.copyFrom || priorGroups(gid())[0]; S.draft = clone(S.mine[from]); while (S.draft.wishlist.length < 3) S.draft.wishlist.push(''); S.step = STEPS; }
    else { S.draft = blankAnswers(); S.step = 1; }
  }
  if (act === 'next' || act === 'submit') {
    S.err = validateStep(S.draft, S.step);
    if (!S.err && act === 'next') { S.step++; window.scrollTo(0, 0); }
    if (!S.err && act === 'submit') {
      for (let st = 3; st <= 5; st++) { S.err = validateStep(S.draft, st); if (S.err) { S.step = st; break; } }
      if (!S.err) {
        const g = gid(); S.draft.wishlist = S.draft.wishlist.filter(Boolean);
        S.mine[g] = S.draft; delete S.seeded[g]; S.draft = null; if (S.votes[g]) delete S.votes[g];
        S.screen = GROUPS[g].fixed ? 'commit' : 'results'; window.scrollTo(0, 0);
      }
    }
  }
  if (act === 'prev') { S.err = ''; S.step--; }
  if (act === 'goto') { S.err = ''; S.step = +val; window.scrollTo(0, 0); }
  if (act === 'vote') {
    const sel = document.querySelector(`select[data-act="alt"][data-item="${b.dataset.item}"]`);
    const raw = sel ? sel.value : undefined, alt = raw === undefined ? undefined : (b.dataset.item === 'schedule' ? raw : +raw);
    return castVote(gid(), b.dataset.item, val === 'yes', alt);
  }
  if (act === 'resetVotes') { delete S.votes[gid()]; delete S.commits[gid()]; }
  if (act === 'commit') S.commits[gid()] = true;
  if (act === 'midjoin') { S.midjoin = val; if (val === 'yes') S.commits[gid()] = true; }
  if (act === 'toResults') { S.screen = 'results'; window.scrollTo(0, 0); }
  if (act === 'rnext' || act === 'rsubmit') {
    const r = S.resurvey;
    S.err = S.step === 1 && !r.prepFit ? '준비 완료 시점이 어땠는지 골라 주세요.' : S.step === 2 && !r.keep ? '정기 시간을 유지할지 골라 주세요.' : '';
    if (!S.err && act === 'rnext') { S.step++; window.scrollTo(0, 0); }
    if (!S.err && act === 'rsubmit') {
      const me = S.mine.g1, changed = [];
      EXPECT.forEach(x => { if (me.expect[x.id] !== r.expect[x.id]) changed.push(`${x.label} ${fmt(me.expect[x.id])}→${fmt(r.expect[x.id])}`); });
      GENRES.forEach(x => { if (me.genres[x.id] !== r.genres[x.id]) changed.push(`${x.label} ${fmt(me.genres[x.id])}→${fmt(r.genres[x.id])}`); });
      if (me.novelty !== r.novelty) changed.push('익숙↔새로운 분야');
      const offAsked = offTasteBooks().length > 0;
      me.expect = r.expect; me.genres = r.genres; me.novelty = r.novelty;
      if (r.keep === 'change') { me.grid = r.grid; delete S.votes.g1; delete S.commits.g1; }
      S.resurveyDone = { ...r, changed, offAsked }; window.scrollTo(0, 0);
    }
  }
  if (act === 'rprev') { S.err = ''; S.step--; }
  save(); render();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.act === 'range') {
    const out = document.querySelector(`[data-val-for="${el.dataset.path}"]`);
    const ends = el.closest('.slider').querySelectorAll('.ends span');
    if (out) out.textContent = sliderText(el.value, ends[0].textContent, ends[1].textContent);
    setPath(target(), el.dataset.path, +el.value); save();
  }
  if (el.dataset.act === 'text') { setPath(S.draft, el.dataset.path, el.value); save(); }
  if (el.dataset.act === 'rtext') { setPath(S.resurvey, el.dataset.path, el.value); save(); }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset.act;
  if (act === 'num') { setPath(S.draft, el.dataset.path, +el.value); S.err = ''; }
  else if (act === 'sim') { S.sim = el.value; delete S.votes[gid()]; delete S.commits[gid()]; }
  else if (act === 'copyFrom') S.copyFrom = el.value;
  else return;
  save(); render();
});

// 처음 열었거나, 저장된 상태가 이전 버전과 맞지 않으면 처음부터
try { if (S.screen === 'survey' && !S.draft) startScenario(S.scenario); else render(); }
catch (err) { S = freshState(); save(); startScenario('new'); }
</script>
</body>
